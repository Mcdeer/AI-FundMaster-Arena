<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI基金经理挑战赛</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script type="module" crossorigin src="/AI-FundMaster-Arena/assets/index-GaHtY5dA.js"></script>
  <link rel="stylesheet" crossorigin href="/AI-FundMaster-Arena/assets/index-0xmluhW0.css">
</head>
<body class="bg-dark-900 text-white min-h-screen overflow-x-hidden">
  <div id="app">
    <!-- 粒子背景 -->
    <canvas id="particle-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- 主容器 -->
    <div class="relative z-10 max-w-6xl mx-auto px-4 py-6">
      <!-- 顶部标题 -->
      <header id="header" class="text-center mb-8 animate-slide-down">
        <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-neon-blue via-neon-purple to-gold-400 bg-clip-text text-transparent">
          🏆 AI基金经理挑战赛
        </h1>
        <p class="text-gray-400 mt-2 text-sm md:text-base">
          挑选你的股票，创建专属基金，与AI同台竞技，发现你的投资人格
        </p>
      </header>

      <!-- 三屏容器 -->
      <main id="screen-container" class="transition-all duration-500">
        <!-- 第1屏：创建基金 -->
        <section id="screen-builder" class="screen active">
          <div class="glass-card rounded-2xl p-6 md:p-8">
            <!-- 基金名称 -->
            <div class="mb-6">
              <label class="block text-sm text-gray-400 mb-2">📛 基金名称</label>
              <input
                id="fund-name"
                type="text"
                placeholder="给基金起个名（可选，留空自动生成）..."
                class="w-full bg-dark-700 border border-dark-500 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-neon-blue transition-colors"
                maxlength="30"
              />
            </div>

            <!-- 市场Tab切换 -->
            <div class="mb-4">
              <label class="block text-sm text-gray-400 mb-2">🌍 选择成分股（1~10只）</label>
              <div class="flex gap-2 flex-wrap" id="market-tabs">
                <button class="market-tab active" data-market="a-share">🇨🇳 A股</button>
                <button class="market-tab" data-market="hk">🇭🇰 港股</button>
                <button class="market-tab" data-market="us">🇺🇸 美股</button>
                <button class="market-tab" data-market="index">📊 指数/ETF</button>
              </div>
            </div>

            <!-- 搜索框 -->
            <div class="mb-4">
              <input id="stock-search" type="text" placeholder="🔍 搜索股票名称或代码..."
                class="w-full bg-dark-700 border border-dark-500 rounded-xl px-4 py-2.5 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-neon-blue transition-colors" />
            </div>

            <!-- 行业筛选 -->
            <div class="flex gap-2 flex-wrap mb-4" id="sector-filters"></div>

            <!-- 股票卡片网格 -->
            <div id="stock-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 mb-6 max-h-[400px] overflow-y-auto custom-scrollbar p-1"></div>

            <!-- 已选股票 -->
            <div id="selected-stocks" class="mb-6">
              <div class="flex items-center justify-between mb-3">
                <span class="text-sm text-gray-400">📋 已选成分股（1~10只）</span>
                <div class="flex items-center gap-4">
                  <label class="flex items-center gap-1 text-xs text-gray-500 cursor-pointer select-none">
                    <input type="checkbox" id="lock-weights" class="accent-neon-blue" />
                    锁定权重（手动调整）
                  </label>
                  <span id="weight-sum" class="text-sm font-mono text-neon-blue">合计: 0%</span>
                </div>
              </div>
              <div id="selected-list" class="space-y-2 min-h-[60px] flex flex-col items-center justify-center text-gray-500 text-sm">
                请从上方选择股票
              </div>
            </div>

            <!-- 行业分布环图 -->
            <div class="mb-6" id="sector-pie-container">
              <div id="sector-pie" class="w-full h-[200px]"></div>
            </div>

            <!-- 回测周期 -->
            <div class="mb-6">
              <label class="block text-sm text-gray-400 mb-2">⏳ 回测周期</label>
              <div class="flex gap-2 flex-wrap mb-2" id="period-selector">
                <button class="period-btn" data-period="3m">近3月</button>
                <button class="period-btn" data-period="6m">近6月</button>
                <button class="period-btn active" data-period="1y">近1年</button>
                <button class="period-btn" data-period="3y">近3年</button>
                <button class="period-btn" data-period="5y">近5年</button>
                <button class="period-btn" data-period="10y">近10年</button>
                <button class="period-btn" data-period="custom">自定义</button>
              </div>
              <p class="text-xs text-gray-600">📅 数据覆盖：2021年8月 ~ 2026年8月（5年日线模拟数据）</p>
              <div id="custom-period-wrap" class="hidden flex items-center gap-2">
                <input id="custom-months" type="number" min="1" max="120" value="18" placeholder="月数"
                  class="w-24 bg-dark-700 border border-dark-500 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-neon-blue" />
                <span class="text-gray-500 text-sm">个月</span>
                <span class="text-gray-600 text-xs">（最多120个月=10年）</span>
              </div>
            </div>

            <!-- 投资金额 + 杠杆 -->
            <div class="grid grid-cols-2 gap-4 mb-6">
              <div>
                <label class="block text-sm text-gray-400 mb-2">💰 投资金额</label>
                <div class="flex items-center gap-2">
                  <input id="invest-amount" type="number" value="100000" min="100" max="100000000" step="1000"
                    class="w-full bg-dark-700 border border-dark-500 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon-blue transition-colors"
                    oninput="this.value = Math.max(100, Math.min(100000000, parseInt(this.value) || 100000))" />
                  <span class="text-gray-500 text-sm">元</span>
                </div>
                <p class="text-xs text-gray-600 mt-1">范围：100元 ~ 1亿元</p>
              </div>
              <div>
                <label class="block text-sm text-gray-400 mb-2">📈 杠杆倍率</label>
                <div class="flex items-center gap-2">
                  <input id="leverage" type="range" min="1" max="10" value="1" step="1"
                    class="w-full accent-neon-blue" />
                  <span id="leverage-display" class="text-neon-blue font-mono text-sm w-8">1x</span>
                </div>
              </div>
            </div>

            <!-- 开始按钮 -->
            <button id="btn-start" class="glow-btn w-full py-4 rounded-xl text-lg font-bold disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-300" disabled>
              ⚡ 开始挑战
            </button>
          </div>
        </section>

        <!-- 第2屏：竞技场 -->
        <section id="screen-arena" class="screen hidden">
          <!-- 排行榜 -->
          <div class="glass-card rounded-2xl p-6 md:p-8 mb-4">
            <h2 class="text-xl font-bold mb-4">⚔️ 收益排行榜</h2>
            <div id="ranking-table" class="space-y-2"></div>
          </div>

          <!-- 收益曲线图 -->
          <div class="glass-card rounded-2xl p-6 md:p-8 mb-4">
            <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
              <h2 class="text-xl font-bold">📈 收益走势对比</h2>
              <div class="flex items-center gap-2">
                <button id="chart-mode-pct" class="px-3 py-1 rounded-lg text-xs font-medium bg-neon-blue/20 text-neon-blue border border-neon-blue/30 active">收益率(%)</button>
                <button id="chart-mode-value" class="px-3 py-1 rounded-lg text-xs font-medium bg-dark-500/30 text-gray-400 border border-dark-500">总价值(元)</button>
              </div>
            </div>
            <div id="chart-returns" class="w-full h-[450px]"></div>
            <!-- 预测区域 -->
            <div id="forecast-section" class="mt-3 hidden">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-xs text-neon-purple">━ 虚线为AI预测走势</span>
                <span class="text-xs text-gray-600 bg-dark-700/50 px-2 py-0.5 rounded">⚠️ 不构成投资建议，仅供娱乐参考</span>
              </div>
            </div>
          </div>

          <!-- 关键指标对比 -->
          <div class="glass-card rounded-2xl p-6 md:p-8 mb-4">
            <h2 class="text-xl font-bold mb-4">📊 关键指标对比</h2>
            <div id="metrics-table" class="overflow-x-auto"></div>
          </div>

          <!-- 查看诊断按钮 -->
          <button id="btn-diagnosis" class="glow-btn w-full py-4 rounded-xl text-lg font-bold transition-all duration-300">
            🧠 查看风格诊断
          </button>
        </section>

        <!-- 第3屏：风格诊断 -->
        <section id="screen-diagnosis" class="screen hidden">
          <div class="glass-card rounded-2xl p-6 md:p-8 mb-4 text-center">
            <h2 class="text-xl font-bold mb-6">🧠 你的投资人格画像</h2>
            <div id="diagnosis-tag" class="mb-4"></div>
            <p id="diagnosis-subtitle" class="text-gray-400 mb-6"></p>
            <!-- 雷达图 -->
            <div id="chart-radar" class="w-full h-[350px] mb-6"></div>
            <!-- AI点评 -->
            <div id="ai-commentary" class="glass-card bg-dark-700/50 rounded-xl p-5 text-left">
              <div class="flex items-start gap-3">
                <span class="text-2xl">🤖</span>
                <div>
                  <p class="text-sm text-gray-400 mb-1">AI投资老炮点评</p>
                  <p id="commentary-text" class="text-white leading-relaxed text-sm md:text-base"></p>
                </div>
              </div>
            </div>
          </div>

          <button id="btn-restart" class="glow-btn w-full py-4 rounded-xl text-lg font-bold transition-all duration-300">
            🔄 再来一局
          </button>
        </section>
      </main>
    </div>
  </div>

</body>
</html>
